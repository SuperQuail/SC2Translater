name: PR 标题

# 合并方式是 squash，所以 PR 标题就是最终落到 main 上的提交信息 —— 在这里卡住它。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: 符合 Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # 中文描述不作大小写约束，只要求非空
          subjectPattern: .+
          subjectPatternError: |
            标题格式应为：<类型>: <说明>
            例如：fix: 空值键没被补齐
