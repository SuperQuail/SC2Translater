name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消上一次还在跑的，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust（格式 / 静态检查 / 测试）
    # 目标平台是 Windows，而且 workspace 里有 src-tauri（Tauri 在 Linux 上要额外装 webkit 依赖），
    # 所以直接跑 Windows，省掉一套只为 CI 存在的配置。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # 真实归档样本不入库，相关用例会自己跳过
        run: cargo test --workspace

  ui:
    name: 前端（构建 / 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: pnpm build（含 vue-tsc 类型检查）
        run: pnpm build

      - name: pnpm test
        run: pnpm test
