[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["TangTian <3331347593@qq.com>"]
description = "SC2Translater —— 星际争霸 II 地图/模组汉化工具（翻译键提取与回填）"
license = "MIT"
repository = "https://github.com/SuperQuail/SC2Translater"

[workspace.dependencies]
sc2mpq = { path = "crates/sc2mpq" }
sc2trans-core = { path = "crates/sc2trans-core" }

anyhow = "1"
bzip2 = "0.4"
clap = { version = "4", features = ["derive", "wrap_help"] }
crc32fast = "1"
flate2 = "1"
lzma-rs = "0.3"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
