[package]
name = "sc2trans-gui"
description = "SC2Translater 桌面版（Tauri 2 壳：只做状态持有与命令转发）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# 显式给 bin 起名，避免与 lib 的 pdb 输出重名（cargo 会把 bin 名的连字符
# 归一成下划线，于是 sc2trans-gui.pdb 与 sc2trans_gui.pdb 撞车）。
[[bin]]
name = "SC2Translater"
path = "src/main.rs"

[lib]
name = "sc2trans_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建**必须**开这个：开了才会把 ui/dist 内嵌进二进制。
#
# 不开的话 release 版也会去连 devUrl（开发服务器），在没有 dev server 的机器上
# 就是一片 ERR_CONNECTION_REFUSED。这个坑在参考项目里踩过一次，别再删。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
sc2trans-core = { path = "../crates/sc2trans-core" }
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
tauri = "2.11.6"
