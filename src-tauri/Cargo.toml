[package]
name = "sc2trans-gui"
description = "SC2Translater 桌面版（Tauri 2 壳：只做状态持有与命令转发）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# 显式给 bin 起名，避免与 lib 的 pdb 输出重名（cargo 会把 bin 名的连字符
# 归一成下划线，于是 sc2trans-gui.pdb 与 sc2trans_gui.pdb 撞车）。
[[bin]]
name = "SC2Translater"
path = "src/main.rs"

[lib]
name = "sc2trans_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 开了才会把 ui/dist 内嵌进二进制；不开的话会去连 devUrl（开发服务器），
# 在没有 dev server 的机器上就是一片空白窗口。
#
# **设成默认特性是刻意的**：这个项目不用 tauri-cli 构建（直接 cargo build --release），
# 忘带 --features 就会静默产出一个打不开的 exe —— 这个坑踩过两次（第一次是参考项目，
# 第二次是本项目自己跑 cargo build --release 忘了带）。默认开 = 不可能再忘。
# 需要连 dev server 调试时用：cargo run --no-default-features -p sc2trans-gui
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
sc2trans-core = { path = "../crates/sc2trans-core" }
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
tauri = "2.11.6"
